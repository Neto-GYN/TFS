<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL 03</title>
    <style>
        .interno{
            color: blue;
            font-size: 13px;
        }
    </style>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <pre>
        3 formas de inserção do CSS no html
        - CSS inline
        - CSS interno
        - CSS externo
    </pre>
 

    <!-- CSS inline -->
    <div style="color: brown; font-size: 14px;">
        Titulo Inline
    </div>
    <!-- CSS interno -->
    <div class="interno">
        Titulo Interno
    </div>
    <!-- CSS externo  -->
    <div class="externo">
        Titulo externo
    </div>
</body>
</html>
